name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm test
      # Six public specs, real calls, the auth path and the Node guard, from this checkout: no release ships blind again.
      - run: npm run qa
      - run: npm publish --provenance --access public
